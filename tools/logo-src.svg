<!-- Source for assets/logo.svg. Text is still live here; `make logo` runs
     Inkscape with export-text-to-path so the committed logo does not depend
     on the viewer's fonts. Helvetica resolves through fontconfig to
     Liberation Sans, which is metric-compatible (see the README's font
     note), so the outlined result matches what the site renders. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="Ministry of Alphabetical Order">
  <rect width="1240" height="400" fill="#0e1013"/>

  <g transform="translate(80 128)">
    <rect width="144" height="144" rx="8" fill="none" stroke="#3ddc97" stroke-width="4"/>
    <text x="43" y="98" text-anchor="middle" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="66" font-weight="bold" fill="#ffffff">A</text>
    <text x="101" y="98" text-anchor="middle" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="66" font-weight="bold" fill="#ffffff">Z</text>
    <rect x="69.5" y="26" width="5" height="92" fill="#3ddc97"/>
  </g>

  <text x="272" y="130" font-family="Liberation Mono, Courier New, monospace" font-size="20" letter-spacing="7" fill="#79818b">OFFICE OF THE REGISTRAR</text>
  <text x="272" y="206" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" letter-spacing="-1.6" fill="#ffffff">MINISTRY OF</text>
  <text x="272" y="268" font-family="Liberation Sans, Helvetica, Arial, sans-serif" font-size="58" font-weight="bold" letter-spacing="-1.6" fill="#ffffff">ALPHABETICAL ORDER</text>
  <text x="272" y="316" font-family="Liberation Mono, Courier New, monospace" font-size="20" letter-spacing="2" fill="#8b939d">EVERY RULING IS CORRECT. SEVERAL CONTRADICT EACH OTHER.</text>
</svg>
